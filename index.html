  if(!syncOn())return;

function hdrs(){return{apikey:CFG.key,Authorization:"Bearer "+CFG.key,"Content-Type":"application/json"}}
async function pushRemote(){
  if(!syncOn())return;
  try{
    setSync("syncing");
    const r=await fetch(CFG.url.replace(/\/$/,"")+"/rest/v1/semester_state",
      {method:"POST",headers:Object.assign(hdrs(),{Prefer:"resolution=merge-duplicates"}),
       body:JSON.stringify({id:CFG.id,data:JSON.stringify(S),updated:S.updated})});
    setSync(r.ok?"synced":"sync failed ("+r.status+")");
  }catch(e){setSync("offline, saved locally")}
}
async function pullRemote(force){
  if(!syncOn())return;
  try{
    setSync("checking");
    const u=CFG.url.replace(/\/$/,"")+"/rest/v1/semester_state?id=eq."+
      encodeURIComponent(CFG.id)+"&select=data,updated";
    const r=await fetch(u,{headers:hdrs()});
    if(!r.ok){setSync("sync failed ("+r.status+")");return}
    const rows=await r.json();
    if(!rows.length){setSync("no cloud copy yet");await pushRemote();return}
    const remote=rows[0];
    if(force||(remote.updated||0)>(S.updated||0)){
      S=Object.assign(S,JSON.parse(remote.data));
      try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}
      setSync("pulled from cloud");render();
    }else setSync("up to date");
  }catch(e){setSync("offline, using local copy")}
}

/* ============================ MATH ============================ */
function compute(c){
  let earned=0,counted=0,remaining=0;const gs={};
  (c.groups||[]).forEach(g=>{
    const each=g.total/g.bestOf;
    const en=c.items.filter(i=>i.group===g.id)
      .map(m=>({id:m.id,v:parseFloat(S.scores[m.id])}))
      .filter(x=>!isNaN(x.v)).sort((a,b)=>b.v-a.v);
    const kept=en.slice(0,g.bestOf);
    kept.forEach(k=>{earned+=each*k.v/100;counted+=each});
    remaining+=g.total-kept.length*each;
    gs[g.id]={kept:kept.map(k=>k.id),each};
  });
  c.items.forEach(i=>{
    if(i.group)return;
    const v=parseFloat(S.scores[i.id]);
    if(!isNaN(v)){earned+=i.w*v/100;counted+=i.w}else remaining+=i.w;
  });
  return{earned,counted,remaining,standing:counted>0?earned/counted*100:null,
         floor:earned,ceiling:earned+remaining,gs};
}
const needFor=(t,e,r)=>r<=0?null:(t-e)/r*100;

  const done=i=>i.type==="t"?!!S.doneTasks[i.id]:S.scores[i.id]!==undefined&&S.scores[i.id]!=="";
  const up=deadlines.filter(i=>d(i.due)>=tm&&!done(i)).slice(0,7);

      <textarea id="dump">${esc(JSON.stringify(S))}</textarea>
      <div class="row" style="gap:8px;margin-top:8px">
        <button class="btn" id="copydump">Copy</button>
        <button class="btn" id="loaddump">Load what is in the box</button></div></div>`;
  }

  document.getElementById("app").innerHTML=h;
  wire();
}

/* ============================ EVENTS ============================ */
function wire(){
  const app=document.getElementById("app");
  app.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});
  app.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>{
    openCourse=openCourse===b.dataset.open?null:b.dataset.open;render()});
  app.querySelectorAll("[data-prep]").forEach(b=>b.onclick=()=>{prepCourse=b.dataset.prep;render()});
  app.querySelectorAll(".mark").forEach(m=>m.onclick=()=>{tab="grades";openCourse=m.dataset.course;render()});
  app.querySelectorAll("[data-score]").forEach(i=>i.onchange=()=>{
    const v=i.value.trim();
    if(v==="")delete S.scores[i.dataset.score];else S.scores[i.dataset.score]=v;
    saveLocal();render()});
  app.querySelectorAll("[data-target]").forEach(i=>i.onchange=()=>{
    S.targets[i.dataset.target]=parseFloat(i.value)||0;saveLocal();render()});
  app.querySelectorAll("[data-read]").forEach(i=>i.onchange=()=>{
    S.readDone[i.dataset.read]=i.checked;saveLocal();render()});
  app.querySelectorAll("[data-task]").forEach(b=>b.onclick=()=>{
    S.doneTasks[b.dataset.task]=!S.doneTasks[b.dataset.task];saveLocal();render()});
  app.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{
    S.customTasks=S.customTasks.filter(t=>t.id!==b.dataset.del);saveLocal();render()});
  app.querySelectorAll("[data-sec]").forEach(s=>s.onchange=()=>{
    S.sections[s.dataset.sec]=s.value;saveLocal();render()});

  const add=document.getElementById("addtask");
  if(add)add.onclick=()=>{
    const t=document.getElementById("ntext").value.trim(), dt=document.getElementById("ndate").value;
    if(!t||!dt)return;
    S.customTasks.push({id:"c"+Date.now(),text:t,due:dt,course:document.getElementById("ncourse").value||null});
    saveLocal();render()};

  const sc=document.getElementById("savecfg");
  if(sc)sc.onclick=async()=>{
    CFG.url=document.getElementById("cfgurl").value.trim();
    CFG.key=document.getElementById("cfgkey").value.trim();
    CFG.id=document.getElementById("cfgid").value.trim();
    saveCfg();await pullRemote(false)};
  const pl=document.getElementById("pullnow"); if(pl)pl.onclick=()=>pullRemote(true);
  const ps=document.getElementById("pushnow"); if(ps)ps.onclick=()=>pushRemote();
  const cd=document.getElementById("copydump");
  if(cd)cd.onclick=()=>{const t=document.getElementById("dump");t.select();
    try{document.execCommand("copy");setSync("copied")}catch(e){}};
  const ld=document.getElementById("loaddump");
  if(ld)ld.onclick=()=>{try{S=Object.assign(S,JSON.parse(document.getElementById("dump").value));
    saveLocal();setSync("loaded");render()}catch(e){setSync("that was not valid backup text")}};
}

/* ============================ BOOT ============================ */
loadLocal();
render();
if(syncOn())pullRemote(false);
window.addEventListener("focus",()=>{if(syncOn())pullRemote(false)});
if("serviceWorker" in navigator)
  window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script>
</body>
</html>
